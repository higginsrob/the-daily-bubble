[project]
name = "the-daily-bubble"
version = "0.1.0"
description = "A CLI assistant whose bubble is your world: profile, weather, and ranked news."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langsmith>=0.3",
    "openai>=1.60",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pydantic>=2.0",
    "typer>=0.15",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
daily-bubble = "daily_bubble.cli:app"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_bubble = ["defaults/**/*.yaml"]
